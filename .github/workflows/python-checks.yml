name: RS Maker Python checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q Init.py InitGui.py freecad tests
      - name: Install pinned optional validation dependencies
        run: python -m pip install --only-binary ":all:" -r requirements-dev.txt
      - name: Run headless checks including OpenCascade and VTracer
        run: python -m unittest discover -s tests -v

  occt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned OpenCascade/VTracer checks
        run: python -m pip install --only-binary ":all:" -r requirements-dev.txt
      - name: Validate puzzle solids, interferences and collectible scenes
        run: python -m unittest discover -s tests -p "test_*geometry_occ.py" -v && python -m unittest discover -s tests -p "test_collection.py" -v && python -m unittest discover -s tests -p "test_themed_collections.py" -v && python -m unittest discover -s tests -p "test_sequential_lock.py" -v
