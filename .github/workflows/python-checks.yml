name: RS Maker Python checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q Init.py InitGui.py freecad tests
      - name: Install stable VTracer to verify optional integration
        run: python -m pip install --only-binary ":all:" vtracer==0.6.15
      - name: Run headless checks including VTracer real smoke test
        run: python -m unittest discover -s tests -v

  occt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independently packaged OpenCascade (CadQuery)
        run: python -m pip install --only-binary ":all:" cadquery==2.6.1
      - name: Validate puzzle solids, interferences and collectible scenes
        run: python -m unittest discover -s tests -p "test_*geometry_occ.py" -v && python -m unittest discover -s tests -p "test_collection.py" -v && python -m unittest discover -s tests -p "test_themed_collections.py" -v
