name: RS Maker Python checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q Init.py InitGui.py freecad tests
      - name: Run headless checks
        run: python -m unittest discover -s tests -v

  vtracer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install stable VTracer Python binary
        run: python -m pip install --only-binary=:all: 'vtracer==0.6.15'
      - name: Test external vectorizer and real SVG hole topology
        run: python -m unittest discover -s tests -p 'test_vtracer_native.py' -v
