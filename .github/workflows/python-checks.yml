name: RS Maker Python checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q Init.py InitGui.py freecad tests
      - name: Install stable VTracer to verify optional integration
        run: python -m pip install --only-binary ":all:" vtracer==0.6.15
      - name: Run headless checks including VTracer real smoke test
        run: python -m unittest discover -s tests -v
